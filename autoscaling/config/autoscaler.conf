# Ganz WNXT Autoscaler Configuration
# =====================================

# --- Instance limits ---
MIN_INSTANCES=2
MAX_INSTANCES=20

# --- Scale-up thresholds ---
# Scale up when any metric exceeds its threshold
CPU_SCALE_UP_THRESHOLD=75       # percent
MEMORY_SCALE_UP_THRESHOLD=80    # percent
CONNECTION_SCALE_UP_THRESHOLD=200

# --- Scale-down thresholds ---
# Scale down only when ALL metrics are below their thresholds
CPU_SCALE_DOWN_THRESHOLD=30     # percent
MEMORY_SCALE_DOWN_THRESHOLD=40  # percent
CONNECTION_SCALE_DOWN_THRESHOLD=50

# --- Scaling step sizes ---
SCALE_UP_STEP=2     # number of instances to add per scale-up event
SCALE_DOWN_STEP=1   # number of instances to remove per scale-down event

# --- Cooldown periods (seconds) ---
SCALE_UP_COOLDOWN=120    # wait after a scale-up before scaling again
SCALE_DOWN_COOLDOWN=300  # wait after a scale-down before scaling again

# --- Health check settings ---
HEALTH_CHECK_ENDPOINT="/health"
HEALTH_CHECK_PORT=8080
HEALTH_CHECK_TIMEOUT=10         # seconds before a check is considered failed
HEALTH_CHECK_RETRIES=3          # consecutive failures before instance is unhealthy

# --- Metrics collection interval ---
METRICS_INTERVAL=30             # seconds between each metrics collection run

# --- Logging ---
LOG_DIR="/var/log/ganz-wnxt/autoscaler"
LOG_FILE="${LOG_DIR}/autoscaler.log"
LOG_LEVEL="INFO"                # DEBUG | INFO | WARN | ERROR

# --- Instance provider configuration ---
# Set PROVIDER to one of: aws | gcp | azure | custom
PROVIDER="custom"

# AWS-specific (used when PROVIDER=aws)
AWS_REGION="us-east-1"
AWS_AUTO_SCALING_GROUP=""

# GCP-specific (used when PROVIDER=gcp)
GCP_PROJECT=""
GCP_ZONE=""
GCP_INSTANCE_GROUP=""

# Azure-specific (used when PROVIDER=azure)
AZURE_RESOURCE_GROUP=""
AZURE_VMSS_NAME=""

# Custom provider script paths (used when PROVIDER=custom)
CUSTOM_ADD_INSTANCE_SCRIPT=""
CUSTOM_REMOVE_INSTANCE_SCRIPT=""
CUSTOM_LIST_INSTANCES_SCRIPT=""

# --- Notification settings ---
NOTIFY_ON_SCALE=true
NOTIFY_WEBHOOK_URL=""           # Optional webhook URL for Slack / Teams alerts
